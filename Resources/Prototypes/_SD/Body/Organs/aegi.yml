- type: entity
  parent: OrganHuman
  id: OrganAegi
  abstract: true
  suffix: aegi

- type: entity
  id: OrganAegiMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Aegi ]

- type: entity
  parent: [ OrganHumanTorso ]
  id: OrganAegiTorso
  suffix: aegi
  components:
  - type: VisualOrganMarkings
    markingData:
      group: Aegi

- type: entity
  parent: [ OrganHumanEars ]
  id: OrganAegiEars
  name: aegi ears
  description: "Cute pointed aegi ears. What are they doing in your hands?..."

- type: entity
  parent: [ OrganAegiMetabolizer, OrganHumanLungs ]
  id: OrganAegiLungs
  name: lobed lungs
  description: "Filters oxygen from an atmosphere. They have a petal structure."
  components:
  - type: Metabolizer
    updateInterval: 1.75
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Aegi ]
    groups:
    - id: Gas
      rateModifier: 200.0

- type: entity
  parent: [ OrganAegiMetabolizer, OrganHumanHeart ]
  id: OrganAegiHeart
  components:
  - type: Metabolizer
    updateInterval: 1.5
    maxReagents: 3
    metabolizerTypes: [ Aegi ]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
