        Asphyxiation: -1.0
  - type: Damageable
    damageModifierSet: Aegi
  - type: Injurable
    damageContainer: Biological
  - type: Stamina
    critThreshold: 110
  - type: MovementSpeedModifier
    weightlessAcceleration: 1.25
    weightlessFriction: 1
    weightlessModifier: 1.15
  - type: Temperature
    heatDamageThreshold: 330
    coldDamageThreshold: 250
    currentTemperature: 310.15
    specificHeat: 42
    coldDamage:
      types:
        Cold: 0.03
    heatDamage:
      types:
        Heat: 1.2
  - type: LanguageSpeaker
    languages:
      GalacticCommon: Speak
      Sindarin: Speak
  - type: SizeAttributeWhitelist
    tall: true
    tallscale: 1.15
